# ─────────────────────────────────────────────────────────────
# cowock — Halal Digital-Products Agent: Configuration
# Change values here to point the agent at YOUR niche & brand.
# ─────────────────────────────────────────────────────────────

brand:
  name: "VoiceDesk AI"
  voice: >-
    plain-spoken, concrete, respectful of a busy owner's time. Talks like a
    tradesperson, not a tech company: no jargon, no "revolutionize", no
    "leverage". Short sentences. Names the real problem (a missed call is a
    lost job) before naming the product.
  audience: >-
    Owners of small local service businesses — salons and barbers, dental and
    medical clinics, plumbers, electricians, HVAC and roofers, auto shops, law
    and real-estate offices, restaurants. Usually 1-20 staff, the owner works
    the job and cannot pick up the phone while doing it.

# The single most important setting. Make it specific.
niche: >-
  AI voice receptionists for local service businesses — answering the calls the
  owner misses while they are on a job, booking appointments, and taking
  messages 24/7.

# What the agent produces. For a SaaS these are LEAD MAGNETS: the free thing
# that earns an email address, which the email sequences then follow up on.
# (Nobody buys an AI receptionist from a tweet; they book a demo after
# recognizing their own problem in something you gave them.)
product_types:
  - checklist      # one-page audit, e.g. "the 7 calls your shop is losing"
  - ebook          # short practical guide for owners
  - template       # scripts, call-handling SOPs, front-desk policies

# Marketing channels the agent drafts content for. Local-business owners live
# on Facebook groups and LinkedIn far more than on Instagram.
channels:
  - facebook       # plain post for local-owner groups
  - linkedin       # professional post, one concrete problem per post
  - email          # launch / nurture email

llm:
  model: "claude-opus-4-8"   # most capable; swap to claude-sonnet-4-6 for cheaper drafts
  max_tokens: 4000
  temperature: 0.7

# Safety / Islamic compliance. The agent self-reviews every output
# against these before anything is queued for your approval.
halal_rules:
  forbid:
    - "riba (interest), conventional loans/credit framed positively"
    - "gambling, lotteries, speculative get-rich-quick schemes"
    - "alcohol, pork, haram food/products"
    - "podcasting/promoting immodesty, nudity, or zina"
    - "deceptive marketing, false scarcity, exaggerated guarantees"
    - "music-heavy or imagery that contradicts Islamic etiquette"
    - "income/earnings claims, guaranteed results, or time-to-result promises (e.g. 'first sale in a week', 'make $X')"
    - "any statement that is not literally, verifiably true"
  require:
    - "TRUTHFULNESS: every claim must be literally true and defensible; no hype, no exaggeration (avoiding najsh)"
    - "honesty and clear value (no overpromising); use 'can/could', never 'will/guaranteed'"
    - "respect for Islamic etiquette (adab) and tone"
    - "halal monetization (direct sale of beneficial product)"

# Market research runs before product creation and guides what to build.
# Paste live web findings into `notes` to ground the analysis in current data.
market_research:
  enabled: true
  notes: >-
    NOTE ON STATUS: this is positioning to validate, not measured data. The
    numbers in the previous version came from a different audience (US moms,
    printables) and no longer apply. Replace this block with real findings once
    the first campaigns have run — `python -m src.main analytics` writes them in
    the right shape.

    BUYER: the owner, not a manager. They answer their own phone, or their
    spouse does, or it rings out. They are not shopping for "AI" — they are
    annoyed about something specific: calls missed while under a sink or in a
    chair, after-hours calls going to a competitor who picked up, the cost of a
    part-time receptionist, no-shows because nobody confirmed.

    THE HOOK IS THE MISSED CALL, NOT THE TECHNOLOGY. Lead with the lost job,
    not the model. "You were on a roof, so the call went to the other guy" beats
    any feature list. Do NOT quantify what we have not measured: no "businesses
    lose X% of calls", no "customers see Y more bookings". Those are exactly the
    unverifiable claims halal_rules forbids — and this buyer has heard them from
    every SaaS that ever cold-called them, which is why they distrust the
    category.

    OBJECTIONS TO ANSWER IN THE COPY: "my customers will hate talking to a
    robot", "it will book things wrong", "I don't have time to set it up",
    "what happens when it doesn't understand someone". Answer plainly; do not
    dodge. Being honest that it hands off to a human is more persuasive than
    claiming it never fails.

    DISCLOSURE: say plainly, in the product and the marketing, that callers are
    talking to an AI. Several US states regulate undisclosed AI callers, and
    hiding it would break the truthfulness rule below regardless of the law.

    CHANNELS: local-owner Facebook groups and LinkedIn, plus trade-specific
    communities (r/plumbing, salon owner groups, dental practice-management
    forums). These are communities, not billboards — post something useful or
    get ignored. NEVER cold-email a business that did not opt in; the list
    module enforces opt-in for a reason.

    SEASONAL HOOKS: trades peak with weather (HVAC in the first heatwave,
    roofers after storms, plumbers over holiday weekends); salons and clinics
    spike in December and early January; restaurants around holidays. Peak
    missed-call windows are exactly when they are busiest — which is the pitch.

# ─── Email marketing ──────────────────────────────────────────
# The agent writes the campaigns and can send them over YOUR SMTP account.
# Credentials never live here — they come from .env (see .env.example).
email:
  enabled: true
  # Put YOUR first name in front of the brand — owners open mail from a person,
  # not from software. Leave the placeholder in and a live send is refused
  # rather than mailing "Your Name at VoiceDesk AI" to real people.
  from_name: "Your Name at VoiceDesk AI"
  from_email: ""            # or set EMAIL_FROM in .env (that wins)
  reply_to: ""              # a real inbox you read — replies book demos
  product_url: ""           # where the CTA points — your demo-booking page
  default_tag: ""           # only mail subscribers with this tag; "" = everyone

  # Required before any live send — both are honesty requirements as much as
  # legal ones (CAN-SPAM): people must be able to leave, and know who wrote.
  unsubscribe_url: ""       # e.g. "https://yoursite.com/unsubscribe?t={token}"
  unsubscribe_mailto: ""    # fallback if you have no website yet
  postal_address: ""        # e.g. "Cowock, 123 Main St, Austin, TX 78701"

  # Throttling. Keeps you under consumer-SMTP caps (Gmail allows ~500/day)
  # and looks like a person rather than a blast.
  rate_limit_per_minute: 20
  daily_limit: 400

  # Where the list, campaigns, outbox and send log live.
  list_path: "emails/subscribers.csv"
  campaigns_dir: "emails/campaigns"
  outbox_dir: "emails/outbox"
  log_path: "emails/send-log.jsonl"

# Nothing is published automatically. Outputs land here for you to review.
output_dir: "products/output"
approvals_dir: "approvals"
